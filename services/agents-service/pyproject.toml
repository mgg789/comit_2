[project]
license = { text = "Apache-2.0" }
name = "agents-service"
version = "0.1.0"
description = "Comit durable vacancy drafts and reusable AI agent runtime"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115", "pydantic>=2.9", "uvicorn[standard]>=0.30", "psycopg[binary]>=3.2,<4", "httpx>=0.27,<1", "pypdf>=6,<7", "Pillow>=11,<12"]

[project.optional-dependencies]
dev = ["pytest-cov>=6,<8", "pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
agents_service = ["migrations/*.sql", "knowledge/*.md", "definitions/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: isolated PostgreSQL integration tests (AGENTS_TEST_DATABASE_URL)"]
