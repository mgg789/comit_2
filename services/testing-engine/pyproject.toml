[project]
license = { text = "Apache-2.0" }
name = "testing-engine"
version = "0.1.0"
description = "Comit testing engine: parameterized task blueprints, seeded variants, grade test scoring (context/60)"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "pyyaml>=6.0",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=6,<8",
  "httpx>=0.27",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.data-files]
blueprints = ["blueprints/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
