[project]
license = { text = "Apache-2.0" }
name = "integration-engine"
version = "0.1.0"
description = "Comit integration engine: external data verification (FSP registry etc.) + demo mock registries"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = [
  "pytest-cov>=6,<8",
  "httpx>=0.27",
  "pytest>=8",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
