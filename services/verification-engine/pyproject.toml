[project]
name = "verification-engine"
version = "0.1.0"
description = "Comit external claim verification with explicit provenance and safe degradation"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "pydantic>=2.9",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
dev = ["pytest-cov>=6,<8", "httpx>=0.27", "pytest>=8", "ruff>=0.9"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
