# Explicit development stack: docker compose -f infra/docker-compose.dev.yml --profile dev up -d --build
---
name: comit-dev
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: comit
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-comit-dev}"
      POSTGRES_DB: comit
    volumes:
    - pgdata:/var/lib/postgresql/data
    - "./postgres/init:/docker-entrypoint-initdb.d:ro"
    healthcheck:
      test:
      - CMD-SHELL
      - pg_isready -U comit -d comit
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
    profiles:
    - dev
    ports:
    - 127.0.0.1:${POSTGRES_PORT:-5433}:5432
  api:
    build:
      context: ".."
      dockerfile: infra/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      JWT_SECRET: "${JWT_SECRET:-}"
      MATCHING_ENGINE_URL: http://matching-engine:8101
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      AGENTS_SERVICE_URL: http://agents-service:8104
      AGENTS_SERVICE_TOKEN: "${AGENTS_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      AUTH_SECRET: "${AUTH_SECRET:-comit-dev-only-nonsecret-configuration-123456}"
      AUTH_ALLOWED_ORIGINS: "${AUTH_ALLOWED_ORIGINS:-http://localhost:8088}"
      AUTH_COOKIE_SECURE: 'false'
      AUTH_KEY_ID: "${AUTH_KEY_ID:-v1}"
      YANDEX_OAUTH_ENABLED: "false"
      YANDEX_OAUTH_CLIENT_ID: "${YANDEX_OAUTH_CLIENT_ID:-}"
      YANDEX_OAUTH_CLIENT_SECRET: "${YANDEX_OAUTH_CLIENT_SECRET:-}"
      YANDEX_OAUTH_SITE_ORIGIN: "${YANDEX_OAUTH_SITE_ORIGIN:-}"
      ACCOUNT_CONSENT_VERSION: "${ACCOUNT_CONSENT_VERSION:-account-v1}"
      TRUST_PROXY: "${TRUST_PROXY:-172.16.0.0/12}"
      SMTP_HOST: "${SMTP_HOST:-host.docker.internal}"
      SMTP_PORT: "${SMTP_PORT:-2525}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Comit <noreply@mail.droidje.com>}"
      SMTP_TLS_SERVERNAME: "${SMTP_TLS_SERVERNAME:-mail.droidje.com}"
      CHAT_SERVICE_URL: http://qgramm-chat:8080
      CHAT_SERVICE_TOKEN: "${CHAT_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      NODE_ENV: development
      DEV_AUTH_EXPOSE_CODE: 'true'
      VERIFICATION_ENGINE_URL: http://verification-engine:8105
      VERIFICATION_ENGINE_TOKEN: "${VERIFICATION_ENGINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      VERIFICATION_DOCUMENT_KEY: "${VERIFICATION_DOCUMENT_KEY:-Y29taXQtZGV2LW9ubHktbm90LWEtc2VjcmV0LTEyMzQ=}"
      FSP_DEMO_ENABLED: 'true'
      TESTING_ENGINE_URL: http://testing-engine:8102
      SUPPORT_EMAIL: "${SUPPORT_EMAIL:-}"
      SUPPORT_ACCESS_KEY: "${SUPPORT_ACCESS_KEY:-}"
      TESTING_ENGINE_TOKEN: "${TESTING_ENGINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-http://localhost:8088}"
      FSP_DEMO_INTERNAL_TOKEN: "${FSP_DEMO_INTERNAL_TOKEN:-comit-dev-fsp-nonsecret-token}"
      FSP_DEMO_CALLBACK_URL: "${FSP_DEMO_CALLBACK_URL:-http://localhost:8088/api/candidate/profile/fsp/demo/callback}"
      FSP_DEMO_PUBLIC_URL: "${FSP_DEMO_PUBLIC_URL:-http://localhost:8103}"
    depends_on:
      postgres:
        condition: service_healthy
      auth-migrate:
        condition: service_completed_successfully
      qgramm-chat:
        condition: service_healthy
      matching-engine:
        condition: service_healthy
      agents-service:
        condition: service_healthy
      verification-engine:
        condition: service_healthy
      testing-engine:
        condition: service_healthy
    ports:
    - 127.0.0.1:${API_PORT:-28080}:8080
    restart: unless-stopped
    networks:
    - default
    - chat-private
    healthcheck:
      test:
      - CMD
      - node
      - "-e"
      - fetch('http://127.0.0.1:8080/ready').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
    profiles:
    - dev
    extra_hosts:
    - host.docker.internal:host-gateway
  matching-engine:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      PORT: 8101
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      HF_HOME: "/models"
    depends_on:
      postgres:
        condition: service_healthy
      candidate-migrate:
        condition: service_completed_successfully
    ports:
    - 127.0.0.1:${MATCHING_PORT:-28101}:8101
    restart: unless-stopped
    volumes:
    - harrier_cache:/models
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8101/ready',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
    - dev
  testing-engine:
    build:
      context: ".."
      dockerfile: infra/testing-engine.Dockerfile
    environment:
      PORT: 8102
      BLUEPRINT_DIR: "/app/blueprints"
      TESTING_API_URL: http://api:8080
      TESTING_ENGINE_TOKEN: "${TESTING_ENGINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      TESTING_DATA_DIR: /data/testing
      TESTING_RECORDING_MODE: "${TESTING_RECORDING_MODE:-off}"
      TESTING_ENABLED: "${TESTING_ENABLED:-true}"
      CODE_JUDGE_URL: "${CODE_JUDGE_URL:-}"
      CODE_JUDGE_TOKEN: "${CODE_JUDGE_TOKEN:-}"
      CODE_JUDGE_CA_PEM: "${CODE_JUDGE_CA_PEM:-}"
      JEV_PROVIDER: "${JEV_PROVIDER:-systemone}"
      JEV_PRICING_VERSION: "${JEV_PRICING_VERSION:-user-2026-10-07}"
      JEV_API_URL: "${JEV_API_URL:-https://ai.sverk.tech/v1/systemone}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_MODEL: "${JEV_MODEL:-kev-latest}"
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      TIMEWEB_BASE_URL: "${TIMEWEB_BASE_URL:-https://api.timeweb.ai/v1}"
      TIMEWEB_MODEL: "${TIMEWEB_MODEL:-timeweb/gpt-oss-120b}"
      TIMEWEB_API_KEY: "${TIMEWEB_API_KEY:-}"
      TIMEWEB_REASONING_EFFORT: "${TIMEWEB_REASONING_EFFORT:-low}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
    ports:
    - 127.0.0.1:${TESTING_PORT:-8102}:8102
    volumes:
    - testing-data:/data/testing
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8102/healthz',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
    - dev
  integration-engine:
    build:
      context: ".."
      dockerfile: infra/integration-engine.Dockerfile
    environment:
      APP_ENV: development
      PORT: 8103
      FSP_DEMO_ENABLED: 'true'
      FSP_DEMO_INTERNAL_TOKEN: "${FSP_DEMO_INTERNAL_TOKEN:-comit-dev-fsp-nonsecret-token}"
      FSP_DEMO_CALLBACK_URL: "${FSP_DEMO_CALLBACK_URL:-http://localhost:8088/api/candidate/profile/fsp/demo/callback}"
    ports:
    - 127.0.0.1:${INTEGRATION_PORT:-8103}:8103
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8103/ready',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    profiles:
    - dev
  web:
    build:
      context: ".."
      dockerfile: infra/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
    - "${WEB_PORT:-8088}:80"
    restart: unless-stopped
    profiles:
    - dev
  candidate-migrate:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - migrate
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
    - dev
  candidate-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      HF_HOME: "/models"
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    volumes:
    - harrier_cache:/models
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  vacancy-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - vacancy-worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      HF_HOME: "/models"
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    volumes:
    - harrier_cache:/models
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  combine-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - combine-worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  rerank-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - rerank-worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  feed-refill-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - feed-refill-worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  preference-worker:
    build:
      context: ".."
      dockerfile: infra/matching-engine.Dockerfile
    command:
    - python
    - "-m"
    - matching_engine
    - preference-worker
    environment:
      APP_ENV: development
      MATCHING_PROMOTION_MODE: "${MATCHING_PROMOTION_MODE:-active}"
      MATCHING_PROMOTION_ALLOW_DEMO: "${MATCHING_PROMOTION_ALLOW_DEMO:-true}"
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      PIPELINE_MAX_ATTEMPTS: 5
      PIPELINE_LEASE_SECONDS: 300
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - dev
  agents-service:
    build:
      context: ".."
      dockerfile: infra/agents-service.Dockerfile
    environment:
      PORT: 8104
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      AGENTS_SERVICE_TOKEN: "${AGENTS_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      MATCHING_ENGINE_URL: http://matching-engine:8101
      AGENTS_MODE: auto
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      JEV_LOCAL_URL: "${JEV_LOCAL_URL:-http://host.docker.internal:12444}"
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      TIMEWEB_BASE_URL: "${TIMEWEB_BASE_URL:-https://api.timeweb.ai/v1}"
      TIMEWEB_MODEL: "${TIMEWEB_MODEL:-timeweb/gpt-oss-120b}"
      TIMEWEB_API_KEY: "${TIMEWEB_API_KEY:-}"
      TIMEWEB_REASONING_EFFORT: "${TIMEWEB_REASONING_EFFORT:-low}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ORGANIZATION_API_URL: http://api:8080
      AGENT_PRICING_VERSION: "${AGENT_PRICING_VERSION:-user-2026-10-07}"
      AGENT_INPUT_USD_PER_MILLION: "${AGENT_INPUT_USD_PER_MILLION:-0.2}"
      AGENT_OUTPUT_USD_PER_MILLION: "${AGENT_OUTPUT_USD_PER_MILLION:-0.7}"
      AGENT_CACHED_INPUT_USD_PER_MILLION: "${AGENT_CACHED_INPUT_USD_PER_MILLION:-0.2}"
      JEV_PROVIDER: "${JEV_PROVIDER:-systemone}"
      JEV_PRICING_VERSION: "${JEV_PRICING_VERSION:-user-2026-10-07}"
      JEV_API_URL: "${JEV_API_URL:-https://ai.sverk.tech/v1/systemone}"
      JEV_MODEL: "${JEV_MODEL:-kev-latest}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_INPUT_USD_PER_MILLION: "${JEV_INPUT_USD_PER_MILLION:-0.042}"
      JEV_OUTPUT_USD_PER_MILLION: "${JEV_OUTPUT_USD_PER_MILLION:-0}"
    depends_on:
      agents-migrate:
        condition: service_completed_successfully
      matching-engine:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8104/ready',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
    - 127.0.0.1:${AGENTS_PORT:-28104}:8104
    profiles:
    - dev
  agents-migrate:
    build:
      context: ".."
      dockerfile: infra/agents-service.Dockerfile
    command:
    - python
    - "-m"
    - agents_service
    - migrate
    environment:
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
    depends_on:
      candidate-migrate:
        condition: service_completed_successfully
    profiles:
    - dev
  agents-worker:
    build:
      context: ".."
      dockerfile: infra/agents-service.Dockerfile
    command:
    - python
    - "-m"
    - agents_service
    - worker
    environment:
      PORT: 8104
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      AGENTS_SERVICE_TOKEN: "${AGENTS_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      MATCHING_ENGINE_URL: http://matching-engine:8101
      AGENTS_MODE: auto
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      JEV_LOCAL_URL: "${JEV_LOCAL_URL:-http://host.docker.internal:12444}"
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      TIMEWEB_BASE_URL: "${TIMEWEB_BASE_URL:-https://api.timeweb.ai/v1}"
      TIMEWEB_MODEL: "${TIMEWEB_MODEL:-timeweb/gpt-oss-120b}"
      TIMEWEB_API_KEY: "${TIMEWEB_API_KEY:-}"
      TIMEWEB_REASONING_EFFORT: "${TIMEWEB_REASONING_EFFORT:-low}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ORGANIZATION_API_URL: http://api:8080
      AGENT_PRICING_VERSION: "${AGENT_PRICING_VERSION:-user-2026-10-07}"
      AGENT_INPUT_USD_PER_MILLION: "${AGENT_INPUT_USD_PER_MILLION:-0.2}"
      AGENT_OUTPUT_USD_PER_MILLION: "${AGENT_OUTPUT_USD_PER_MILLION:-0.7}"
      AGENT_CACHED_INPUT_USD_PER_MILLION: "${AGENT_CACHED_INPUT_USD_PER_MILLION:-0.2}"
      JEV_PROVIDER: "${JEV_PROVIDER:-systemone}"
      JEV_PRICING_VERSION: "${JEV_PRICING_VERSION:-user-2026-10-07}"
      JEV_API_URL: "${JEV_API_URL:-https://ai.sverk.tech/v1/systemone}"
      JEV_MODEL: "${JEV_MODEL:-kev-latest}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_INPUT_USD_PER_MILLION: "${JEV_INPUT_USD_PER_MILLION:-0.042}"
      JEV_OUTPUT_USD_PER_MILLION: "${JEV_OUTPUT_USD_PER_MILLION:-0}"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      matching-engine:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - dev
  organization-agent-worker:
    build:
      context: ".."
      dockerfile: infra/agents-service.Dockerfile
    command:
    - python
    - "-m"
    - agents_service
    - organization-worker
    environment:
      PORT: 8104
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      AGENTS_SERVICE_TOKEN: "${AGENTS_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      MATCHING_ENGINE_URL: http://matching-engine:8101
      AGENTS_MODE: auto
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      JEV_LOCAL_URL: "${JEV_LOCAL_URL:-http://host.docker.internal:12444}"
      LLM_PROVIDER: "${LLM_PROVIDER:-deepseek}"
      TIMEWEB_BASE_URL: "${TIMEWEB_BASE_URL:-https://api.timeweb.ai/v1}"
      TIMEWEB_MODEL: "${TIMEWEB_MODEL:-timeweb/gpt-oss-120b}"
      TIMEWEB_API_KEY: "${TIMEWEB_API_KEY:-}"
      TIMEWEB_REASONING_EFFORT: "${TIMEWEB_REASONING_EFFORT:-low}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-https://api.deepseek.com}"
      DEEPSEEK_MODEL: "${DEEPSEEK_MODEL:-deepseek-flash}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      ORGANIZATION_API_URL: http://api:8080
      AGENT_PRICING_VERSION: "${AGENT_PRICING_VERSION:-user-2026-10-07}"
      AGENT_INPUT_USD_PER_MILLION: "${AGENT_INPUT_USD_PER_MILLION:-0.2}"
      AGENT_OUTPUT_USD_PER_MILLION: "${AGENT_OUTPUT_USD_PER_MILLION:-0.7}"
      AGENT_CACHED_INPUT_USD_PER_MILLION: "${AGENT_CACHED_INPUT_USD_PER_MILLION:-0.2}"
      JEV_PROVIDER: "${JEV_PROVIDER:-systemone}"
      JEV_PRICING_VERSION: "${JEV_PRICING_VERSION:-user-2026-10-07}"
      JEV_API_URL: "${JEV_API_URL:-https://ai.sverk.tech/v1/systemone}"
      JEV_MODEL: "${JEV_MODEL:-kev-latest}"
      JEV_API_KEY: "${JEV_API_KEY:-}"
      JEV_INPUT_USD_PER_MILLION: "${JEV_INPUT_USD_PER_MILLION:-0.042}"
      JEV_OUTPUT_USD_PER_MILLION: "${JEV_OUTPUT_USD_PER_MILLION:-0}"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      matching-engine:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - dev
  auth-migrate:
    build:
      context: ".."
      dockerfile: infra/api.Dockerfile
    command:
    - node
    - dist/auth/migrate.js
    environment:
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
    depends_on:
      agents-migrate:
        condition: service_completed_successfully
    profiles:
    - dev
  auth-mail-worker:
    build:
      context: ".."
      dockerfile: infra/api.Dockerfile
    command:
    - node
    - dist/auth/mail-worker.js
    environment:
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      AUTH_SECRET: "${AUTH_SECRET:-comit-dev-only-nonsecret-configuration-123456}"
      SMTP_HOST: "${SMTP_HOST:-host.docker.internal}"
      SMTP_PORT: "${SMTP_PORT:-2525}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      SMTP_FROM: "${SMTP_FROM:-Comit <noreply@mail.droidje.com>}"
      SMTP_TLS_SERVERNAME: "${SMTP_TLS_SERVERNAME:-mail.droidje.com}"
      NODE_ENV: development
      DEV_AUTH_EXPOSE_CODE: 'true'
      PUBLIC_SITE_URL: "${PUBLIC_SITE_URL:-http://localhost:8088}"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    profiles:
    - prod
    extra_hosts:
    - host.docker.internal:host-gateway
  qgramm-chat:
    build:
      context: ".."
      dockerfile: infra/qgramm/Dockerfile
    environment:
      CHAT_BRIDGE_LISTEN: 0.0.0.0:8080
      CHAT_SERVICE_TOKEN: "${CHAT_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      CHAT_DEVICE_SECRET: "${CHAT_DEVICE_SECRET:-Y29taXQtZGV2LW9ubHktbm90LWEtc2VjcmV0LTEyMzQ=}"
      CHAT_SIGNING_KEY: "${CHAT_SIGNING_KEY:-Y29taXQtZGV2LW9ubHktbm90LWEtc2VjcmV0LTEyMzQ=}"
      QGRAMM_MANAGEMENT_SECRET: "${QGRAMM_MANAGEMENT_SECRET:-comit-dev-only-nonsecret-configuration-123456}"
      QGRAMM_MASTER_KEY: "${QGRAMM_MASTER_KEY:-Y29taXQtZGV2LW9ubHktbm90LWEtc2VjcmV0LTEyMzQ=}"
      QGRAMM_HPKE_KEY: "${QGRAMM_HPKE_KEY:-Y29taXQtZGV2LW9ubHktbm90LWEtc2VjcmV0LTEyMzQ=}"
    volumes:
    - chat-data:/data
    networks:
    - chat-private
    restart: unless-stopped
    security_opt:
    - no-new-privileges:true
    read_only: true
    tmpfs:
    - "/tmp"
    profiles:
    - dev
  candidate-profile-worker:
    build:
      context: ".."
      dockerfile: infra/api.Dockerfile
    command:
    - node
    - dist/profiles/worker.js
    environment:
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      MATCHING_ENGINE_URL: http://matching-engine:8101
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      candidate-migrate:
        condition: service_completed_successfully
      matching-engine:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - dev
  recommendation-worker:
    build:
      context: ".."
      dockerfile: infra/api.Dockerfile
    command:
    - node
    - dist/recommendations/worker.js
    environment:
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit-dev}@postgres:5432/comit
      MATCHING_ENGINE_URL: http://matching-engine:8101
      CANDIDATE_PIPELINE_TOKEN: "${CANDIDATE_PIPELINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      AGENTS_SERVICE_URL: http://agents-service:8104
      AGENTS_SERVICE_TOKEN: "${AGENTS_SERVICE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      NODE_ENV: development
    depends_on:
      auth-migrate:
        condition: service_completed_successfully
      matching-engine:
        condition: service_healthy
      agents-service:
        condition: service_healthy
    restart: unless-stopped
    profiles:
    - dev
  verification-engine:
    build:
      context: ".."
      dockerfile: infra/verification-engine.Dockerfile
    environment:
      PORT: 8105
      INTEGRATION_ENGINE_URL: http://integration-engine:8103
      VERIFICATION_ENGINE_TOKEN: "${VERIFICATION_ENGINE_TOKEN:-comit-dev-only-nonsecret-configuration-123456}"
      HH_API_TOKEN: "${HH_API_TOKEN:-}"
      HH_USER_AGENT: "${HH_USER_AGENT:-comit-verification/0.1}"
      FSP_DEMO_ENABLED: 'true'
      FSP_DEMO_INTERNAL_TOKEN: "${FSP_DEMO_INTERNAL_TOKEN:-comit-dev-fsp-nonsecret-token}"
    depends_on:
    - integration-engine
    expose:
    - '8105'
    healthcheck:
      test:
      - CMD
      - python
      - "-c"
      - import urllib.request; urllib.request.urlopen('http://127.0.0.1:8105/healthz',
        timeout=3)
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    ports:
    - 127.0.0.1:${VERIFICATION_PORT:-28105}:8105
    restart: unless-stopped
    profiles:
    - dev
volumes:
  testing-data:
  pgdata:
  harrier_cache:
  chat-data:
networks:
  chat-private:
    internal: true
