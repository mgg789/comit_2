name: comit

# Production stack for mgg-server (/home/mgg/comit, docs/deploy.md).
# Same images as dev; no published engine/db ports, restart policies on.

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: comit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: comit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comit -d comit"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD}@postgres:5432/comit
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  matching-engine:
    build:
      context: ..
      dockerfile: infra/matching-engine.Dockerfile
    environment:
      PORT: 8101
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD}@postgres:5432/comit
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  testing-engine:
    build:
      context: ..
      dockerfile: infra/testing-engine.Dockerfile
    environment:
      PORT: 8102
      BLUEPRINT_DIR: /app/blueprints
    restart: unless-stopped

  integration-engine:
    build:
      context: ..
      dockerfile: infra/integration-engine.Dockerfile
    environment:
      PORT: 8103
    restart: unless-stopped

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:80"
    restart: unless-stopped

volumes:
  pgdata:
