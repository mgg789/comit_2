name: comit

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: comit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-comit}
      POSTGRES_DB: comit
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U comit -d comit"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ..
      dockerfile: infra/api.Dockerfile
    environment:
      PORT: 8080
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit}@postgres:5432/comit
      VERIFICATION_ENGINE_URL: http://verification-engine:8105
      VERIFICATION_ENGINE_TOKEN: ${VERIFICATION_ENGINE_TOKEN:-}
      VERIFICATION_DOCUMENT_KEY: ${VERIFICATION_DOCUMENT_KEY:-}
      FSP_DEMO_INTERNAL_TOKEN: ${FSP_DEMO_INTERNAL_TOKEN:-}
      FSP_DEMO_CALLBACK_URL: ${FSP_DEMO_CALLBACK_URL:-http://localhost:8080/candidate/profile/fsp/demo/callback}
      FSP_DEMO_PUBLIC_URL: ${FSP_DEMO_PUBLIC_URL:-http://localhost:8103}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"

  matching-engine:
    build:
      context: ..
      dockerfile: infra/matching-engine.Dockerfile
    environment:
      PORT: 8101
      DATABASE_URL: postgres://comit:${POSTGRES_PASSWORD:-comit}@postgres:5432/comit
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${MATCHING_PORT:-8101}:8101"

  testing-engine:
    build:
      context: ..
      dockerfile: infra/testing-engine.Dockerfile
    environment:
      PORT: 8102
      BLUEPRINT_DIR: /app/blueprints
    ports:
      - "${TESTING_PORT:-8102}:8102"

  integration-engine:
    build:
      context: ..
      dockerfile: infra/integration-engine.Dockerfile
    environment:
      PORT: 8103
      FSP_DEMO_INTERNAL_TOKEN: ${FSP_DEMO_INTERNAL_TOKEN:-}
      FSP_DEMO_CALLBACK_URL: ${FSP_DEMO_CALLBACK_URL:-http://localhost:8080/candidate/profile/fsp/demo/callback}
    ports:
      - "${INTEGRATION_PORT:-8103}:8103"

  verification-engine:
    build:
      context: ..
      dockerfile: infra/verification-engine.Dockerfile
    environment:
      PORT: 8105
      INTEGRATION_ENGINE_URL: http://integration-engine:8103
      VERIFICATION_ENGINE_TOKEN: ${VERIFICATION_ENGINE_TOKEN:-}
      HH_API_TOKEN: ${HH_API_TOKEN:-}
      HH_USER_AGENT: ${HH_USER_AGENT:-comit-verification/0.1}
      FSP_DEMO_INTERNAL_TOKEN: ${FSP_DEMO_INTERNAL_TOKEN:-}
    depends_on:
      - integration-engine
    expose:
      - "8105"

  web:
    build:
      context: ..
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - "${WEB_PORT:-8088}:80"

volumes:
  pgdata:
