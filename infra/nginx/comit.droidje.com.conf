# Host nginx vhost; application gateway remains on 127.0.0.1:8088.
server {
    listen 80;
    server_name comit.droidje.com;
    location ^~ /.well-known/acme-challenge/ { root /var/www/comit-acme; }
    # A mistakenly HTTP callback must also avoid logging its query before redirect.
    location ~ ^/api/auth/(candidate|employer)/yandex/callback$ {
        access_log off;
        return 301 https://comit.droidje.com$request_uri;
    }
    location / { return 301 https://comit.droidje.com$request_uri; }
}
server {
    listen 443 ssl;
    server_name comit.droidje.com;
    add_header Strict-Transport-Security "max-age=15552000" always;
    # Allow current local assets, inline React styles and local MediaPipe Wasm.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://oauth.yandex.ru" always;

    ssl_certificate /etc/letsencrypt/live/comit.droidje.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/comit.droidje.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    # Preserve the callback URI while keeping OAuth code/state out of access logs.
    location ~ ^/api/auth/(candidate|employer)/yandex/callback$ {
        access_log off;
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8088;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location / {
        client_max_body_size 16m;
        proxy_pass http://127.0.0.1:8088;
        proxy_buffering off;
        proxy_read_timeout 90s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
