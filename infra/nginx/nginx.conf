# Single nginx for the four web apps and the api proxy.
# Paths must stay in sync with each app's vite `base` (apps/*/vite.config.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/welcome;
    index index.html;

    # Liveness for the smoke gate without touching upstream services
    location = /healthz {
        return 200 'ok\n';
    }

    location /api/ {
        # Chat uploads carry at most 8 MiB as base64; Fastify enforces narrower limits per route.
        client_max_body_size 12m;
        proxy_pass http://api:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /candidate/ {
        alias /usr/share/nginx/html/candidate/;
        try_files $uri $uri/ /candidate/index.html;
    }

    location /employer/ {
        alias /usr/share/nginx/html/employer/;
        try_files $uri $uri/ /employer/index.html;
    }

    location /testing/ {
        alias /usr/share/nginx/html/testing/;
        try_files $uri $uri/ /testing/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
