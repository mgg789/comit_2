# Single nginx for the five product web apps and the api proxy.
# Paths must stay in sync with each app's vite `base` (apps/*/vite.config.ts).
server {
    listen 80;
    server_name _;

    # Allow current local assets, inline React styles and local MediaPipe Wasm.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self'; media-src 'self' blob:; worker-src 'self' blob:; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self' https://oauth.yandex.ru" always;

    root /usr/share/nginx/html/welcome;
    index index.html;

    # Liveness for the smoke gate without touching upstream services
    location = /healthz {
        return 200 'ok\n';
    }

    # Metrics stay available only through the private API service for scraping.
    location = /api/metrics { return 404; }
    location ^~ /api/metrics/ { return 404; }

    # Internal service APIs are never part of the browser gateway.
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    # OAuth query strings carry one-time credentials; never write them to access logs.
    location = /api/auth/candidate/yandex/callback {
        access_log off;
        client_max_body_size 16m;
        proxy_pass http://api:8080/auth/candidate/yandex/callback;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OAuth query strings carry one-time credentials; never write them to access logs.
    location = /api/auth/employer/yandex/callback {
        access_log off;
        client_max_body_size 16m;
        proxy_pass http://api:8080/auth/employer/yandex/callback;
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/ {
        # 10 MiB proof documents expand to ~14 MiB as base64; routes enforce byte limits.
        client_max_body_size 16m;
        proxy_pass http://api:8080/;
        # SSE responses must reach the browser as events arrive (streams last <=60s).
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /candidate/ {
        alias /usr/share/nginx/html/candidate/;
        try_files $uri $uri/ /candidate/index.html;
    }

    location /employer/ {
        alias /usr/share/nginx/html/employer/;
        try_files $uri $uri/ /employer/index.html;
    }

    location = /testing { return 302 /testing/; }
    location /testing/ {
        alias /usr/share/nginx/html/testing/;
        try_files $uri $uri/ /testing/index.html;
    }

    location = /support { return 302 /support/; }
    location /support/ {
        alias /usr/share/nginx/html/support/;
        try_files $uri $uri/ /support/index.html;
    }

    location = /help { return 302 /help/; }
    location ^~ /help/ {
        alias /usr/share/nginx/html/help/;
        try_files $uri $uri/ =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
