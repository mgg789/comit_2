# Single nginx for the five product web apps and the api proxy.
# Paths must stay in sync with each app's vite `base` (apps/*/vite.config.ts).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html/welcome;
    index index.html;

    # Liveness for the smoke gate without touching upstream services
    location = /healthz {
        return 200 'ok\n';
    }

    # Internal service APIs are never part of the browser gateway.
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location /api/ {
        # 10 MiB proof documents expand to ~14 MiB as base64; routes enforce byte limits.
        client_max_body_size 16m;
        proxy_pass http://api:8080/;
        # SSE responses must reach the browser as events arrive (streams last <=60s).
        proxy_buffering off;
        proxy_read_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /candidate/ {
        alias /usr/share/nginx/html/candidate/;
        try_files $uri $uri/ /candidate/index.html;
    }

    location /employer/ {
        alias /usr/share/nginx/html/employer/;
        try_files $uri $uri/ /employer/index.html;
    }

    location = /testing { return 302 /testing/; }
    location /testing/ {
        alias /usr/share/nginx/html/testing/;
        try_files $uri $uri/ /testing/index.html;
    }

    location = /support { return 302 /support/; }
    location /support/ {
        alias /usr/share/nginx/html/support/;
        try_files $uri $uri/ /support/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
